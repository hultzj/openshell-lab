---
site:
  title: "OpenShell on Zero Trust: securing AI agents on OpenShift"
  url: https://hultzj.github.io/openshell-lab
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      # English is the source; content-<lang> are translations (scripts/check-translations.sh keeps them in step).
      start_paths: [content, content-ja, content-ko, content-zh]

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
    snapshot: true
  # Sets <html lang> from each component's page-lang attribute; the theme hard-codes "en".
  supplemental_files: ./supplemental-ui

# No antora.extensions: the field-content Showroom builder image has none installed.

output:
  dir: ./www
