# Parent Application for clusters without an RHDP order; `make bootstrap` fills in the ingress domain,
# the git revision, the Argo CD namespace and whether to install ZTVP. On RHDP the Field Content CI
# creates the equivalent itself ("field-content" in openshift-gitops, path = repo root).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshell-lab
  namespace: GITOPS_NS
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: openshell-lab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hultzj/openshell-lab.git
    targetRevision: "GIT_REVISION"
    path: .
    helm:
      valuesObject:
        deployer:
          domain: DEPLOYER_DOMAIN
        gitops:
          repoURL: https://github.com/hultzj/openshell-lab.git
          revision: "GIT_REVISION"
          path: ""
        argocd:
          namespace: GITOPS_NS
        ztvp:
          enabled: ZTVP_ENABLED
          # The RHDP defaults reuse operators an RHDP base install runs; elsewhere ZTVP installs its own.
          extraParameters: []
        prereqs:
          webTerminal:
            install: WEB_TERMINAL_INSTALL
          # Raising the pod limit reboots the node; set 500 here for a single node that runs out of pods.
          maxPods: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: GITOPS_NS
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
