# Lab details in the RHDP userinfo format. The participant password is added by the participant-setup Job.
# The field-content workload does not collect these (checked 2026-11-04), so its order page does not show them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-info
  namespace: {{ .Values.prereqs.namespace }}
  labels:
    demo.redhat.com/application: field-content
    demo.redhat.com/userinfo: ""
data:
  lab_title: "OpenShell on Zero Trust: securing AI agents on OpenShift"
  console_url: "https://console-openshift-console.{{ .Values.deployer.domain }}"
  {{- if .Values.showroom.enabled }}
  showroom_url: "https://showroom-{{ .Values.showroom.namespace }}.{{ .Values.deployer.domain }}"
  {{- end }}
  lab_user_credentials: "oc get secret lab-user-credentials -n {{ .Values.prereqs.namespace }}"
  ztvp_note: "Zero Trust Validated Pattern installs in 30-40 minutes after the order completes; check Argo CD in openshift-gitops."
