# The patterns operator cannot load Vault secrets; pattern.sh does it from a laptop with
# "make load-secrets". This Job runs the same playbook (rhvp.cluster_utils.load_secrets) in-cluster,
# with the pattern's template (every value generated), retrying until Vault and ESO exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztvp-load-secrets
  namespace: patterns-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshell-lab-ztvp-load-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ztvp-load-secrets
    namespace: patterns-operator
---
{{- /* Immutable Job: a hash of the spec in the name turns a changed input into a new Job. */}}
{{- $spec := include "ztvp-load-secrets.spec" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ztvp-load-secrets-{{ $spec | sha256sum | trunc 8 }}
  namespace: patterns-operator
  labels:
    app.kubernetes.io/name: ztvp-load-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
{{ $spec | indent 2 }}
{{- define "ztvp-load-secrets.spec" }}
backoffLimit: 2
activeDeadlineSeconds: 7200
template:
  spec:
    serviceAccountName: ztvp-load-secrets
    restartPolicy: Never
    containers:
      - name: load-secrets
        image: {{ .Values.ztvp.utilityImage }}
        env:
          - { name: HOME, value: /tmp/home }
          - { name: ANSIBLE_STDOUT_CALLBACK, value: default }
          - { name: REPO, value: {{ .Values.ztvp.pattern.repoURL | quote }} }
          - { name: REV, value: {{ .Values.ztvp.pattern.revision | quote }} }
          - { name: PATTERN, value: {{ .Values.ztvp.pattern.name | quote }} }
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -uo pipefail
            mkdir -p "$HOME"
            git clone -q --depth 1 -b "$REV" "$REPO" /tmp/pattern || exit 1
            cp /tmp/pattern/values-secret.yaml.template "$HOME/values-secret-$PATTERN.yaml"
            cd /tmp/pattern
            for i in $(seq 1 100); do
              ready=$(oc get pod vault-0 -n vault -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null)
              eso=$(oc get serviceaccount -n external-secrets -o name 2>/dev/null | grep -c . || true)
              if [ "$ready" = true ] && [ "$eso" -gt 0 ]; then
                echo "== attempt $i: Vault ready, External Secrets present; loading secrets"
                if ansible-playbook rhvp.cluster_utils.load_secrets; then echo "secrets loaded"; exit 0; fi
              else
                echo "== attempt $i: waiting (vault-0 ready=${ready:-no}, external-secrets SAs=$eso)"
              fi
              sleep 60
            done
            echo "gave up after 100 attempts"; exit 1
        resources:
          requests: { cpu: 100m, memory: 256Mi }
{{- end }}
