name: github pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: lab contract (strict; red until every step is verified live)
        run: bash scripts/check-lab.sh
      - name: automation self-tests
        run: |
          # python3-bcrypt: the in-cluster participant Job hashes with it (its image has no htpasswd).
          python3 -m pip install --quiet bcrypt
          bash automation/tests/participant-user-test.sh
          NO_HTPASSWD=1 bash automation/tests/participant-user-test.sh
          bash automation/tests/setup-participant-test.sh
          bash automation/tests/web-terminal-install-test.sh
          bash automation/tests/rhdp-defaults-test.sh
          bash automation/tests/verify-headroom-test.sh
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: www
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
