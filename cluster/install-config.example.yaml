apiVersion: v1
baseDomain: sandbox3022.opentlc.com
metadata:
  name: sno-ztm
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  platform:
    aws:
      zones:
      - us-east-2a
  replicas: 0
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  platform:
    aws:
      type: m6i.8xlarge
      zones:
      - us-east-2a
      rootVolume:
        size: 300
        type: gp3
  replicas: 1
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 10.0.0.0/16
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
platform:
  aws:
    region: us-east-2
publish: External
pullSecret: '<PULL_SECRET_JSON>'   # from console.redhat.com, never commit
sshKey: '<SSH_PUBLIC_KEY>'
