{{- /* Child Applications, one per component. Paths are relative to gitops.path (empty = repo root). */ -}}
{{- $base := trimSuffix "/" (.Values.gitops.path | default "") -}}
{{- $prefix := ternary "" (printf "%s/" $base) (eq $base "") -}}
{{- define "openshell-lab.syncPolicy" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
{{- if .Values.ztvp.enabled }}
---
# Zero Trust Validated Pattern: patterns operator, Pattern CR, in-cluster secret loading.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-ztvp
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision | quote }}
    path: {{ $prefix }}components/ztvp
    helm:
      valuesObject:
        partOf: {{ .Release.Name | quote }}
        ztvp:
          {{- toYaml .Values.ztvp | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: patterns-operator
  {{- include "openshell-lab.syncPolicy" . | nindent 0 }}
{{- end }}
{{- if .Values.prereqs.enabled }}
---
# Lab prerequisites: Web Terminal operator, participant user, RHDP userinfo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-prereqs
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision | quote }}
    path: {{ $prefix }}components/lab-prereqs
    helm:
      valuesObject:
        partOf: {{ .Release.Name | quote }}
        prereqs:
          {{- toYaml .Values.prereqs | nindent 10 }}
        showroom:
          enabled: {{ .Values.showroom.enabled }}
          namespace: {{ .Values.showroom.namespace | quote }}
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.prereqs.namespace }}
  {{- include "openshell-lab.syncPolicy" . | nindent 0 }}
{{- end }}
{{- if .Values.showroom.enabled }}
---
# Showroom guide: the upstream field-content chart, pinned, rendering this repo's content.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-showroom
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: field-content
    app.kubernetes.io/part-of: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.showroom.chart.repoUrl }}
    targetRevision: {{ .Values.showroom.chart.revision | quote }}
    path: {{ .Values.showroom.chart.path }}
    helm:
      valuesObject:
        showroom:
          namespace: {{ .Values.showroom.namespace }}
          content:
            repoUrl: {{ .Values.gitops.repoURL | quote }}
            repoRef: {{ .Values.gitops.revision | quote }}
          terminal:
            enabled: {{ .Values.showroom.terminal }}
            image: {{ .Values.showroom.terminalImage | quote }}
        deployer:
          domain: {{ .Values.deployer.domain | quote }}
        demo:
          namespace: {{ .Values.lab.namespace | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.showroom.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
